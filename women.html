<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',Arial,sans-serif;}
body{background:#fff;color:#222}
.header{position:sticky;top:0;background:#1DB954;padding:14px;text-align:center;z-index:1000;}
.brand-link{color:#fff;font-size:22px;font-weight:bold;text-decoration:none;}
.page-title{text-align:center;margin:18px 0 10px;color:#0F7A3D;font-size:20px;}
.page-products{padding:10px 14px 40px;}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:768px){.products-grid{grid-template-columns:repeat(4,1fr)}}
.product-card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);}
.product-slider{position:relative;width:100%;aspect-ratio:1/1;overflow:hidden;}
.slider-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;cursor:pointer;}
.slider-image.active{display:block;}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:18px;cursor:pointer;z-index:5;}
.arrow.left{right:8px}
.arrow.right{left:8px}
.product-info{padding:10px;text-align:center;}
.product-info h3{font-size:14px;margin-bottom:6px;}
.buy-btn{display:inline-block;background:#1DB954;color:#fff;text-decoration:none;padding:7px 12px;border-radius:8px;font-size:13px;}
.size-select,.color-select{width:100%;padding:6px 10px;margin:4px 0;border:1px solid #1DB954;border-radius:6px;font-size:13px;background:#fff;color:#222;}

/* Lightbox */
.lightbox {position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: .3s; z-index: 9999;}
.lightbox.show {opacity: 1; pointer-events: auto;}
.lightbox img {max-width: 90%; max-height: 90%; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.5); cursor: zoom-out;}

/* Order Modal */
.order-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s;z-index:10000;}
.order-modal.show{opacity:1;pointer-events:auto;}
.order-box{background:#fff;width:90%;max-width:360px;padding:16px;border-radius:12px;}
.order-box h3{text-align:center;margin-bottom:10px;font-size:16px;}
.order-box input{width:100%;margin-bottom:8px;padding:8px 10px;border:1px solid #ddd;border-radius:8px;font-size:13px;}
.order-actions{display:flex;gap:8px;margin-top:6px;}
.order-actions button{flex:1;padding:8px;border:none;border-radius:8px;cursor:pointer;font-size:13px;}
.order-actions button[type="submit"]{background:#1DB954;color:#fff;}
#closeOrder{background:#eee;}
</style>
</head>

</section>

<!-- Lightbox و Order Modal نفس الكود -->
<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="صورة المنتج">
</div>

<div class="order-modal" id="orderModal">
  <div class="order-box">
    <h3 id="orderTitle">تأكيد الطلب</h3>
    <form id="orderForm">
      <input type="text" id="custName" placeholder="الاسم" required>
      <input type="tel" id="custPhone" placeholder="رقم التليفون" required>
      <input type="text" id="custAddress" placeholder="العنوان" required>
      <input type="text" id="custSize" placeholder="المقاس" required>
      <input type="text" id="custColor" placeholder="اللون" required>
      <div class="order-actions">
        <button type="submit">تاكيد الطلب</button>
        <button type="button" id="closeOrder">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<script>
// نفس كود السلايدر واللايت بوكس والطلب
document.querySelectorAll('.product-card').forEach(card=>{
  const images = card.querySelectorAll('.slider-image');
  const next = card.querySelector('.arrow.right');
  const prev = card.querySelector('.arrow.left');
  let i=0;
  function show(n){images.forEach(img=>img.classList.remove('active')); images[n].classList.add('active');}
  next.addEventListener('click',()=>{i=(i+1)%images.length; show(i);});
  prev.addEventListener('click',()=>{i=(i-1+images.length)%images.length; show(i);});
});

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
document.querySelectorAll('.slider-image').forEach(img=>{img.addEventListener('click', ()=>{lightboxImg.src = img.src; lightbox.classList.add('show');});});
lightbox.addEventListener('click', e=>{if(e.target===lightbox || e.target===lightboxImg){lightbox.classList.remove('show');}});
document.addEventListener('keydown', e=>{if(e.key==="Escape") lightbox.classList.remove('show');});

let selectedCard = null;
const modal = document.getElementById("orderModal");
const form = document.getElementById("orderForm");
const closeBtn = document.getElementById("closeOrder");
const orderTitle = document.getElementById("orderTitle");

document.querySelectorAll(".buy-btn").forEach(btn=>{
  btn.addEventListener("click", function(e){
    e.preventDefault();
    selectedCard = this.closest(".product-card");
    const size = selectedCard.querySelector(".size-select").value;
    const color = selectedCard.querySelector(".color-select").value;
    document.getElementById("custSize").value = size;
    document.getElementById("custColor").value = color;
    orderTitle.innerText = selectedCard.querySelector("h3").innerText;
    modal.classList.add("show");
  });
});

closeBtn.onclick = ()=>{modal.classList.remove("show"); form.reset();};
modal.addEventListener("click", e=>{if(e.target===modal){modal.classList.remove("show"); form.reset();}});
form.addEventListener("submit", function(e){
  e.preventDefault();
  if(!selectedCard) return;
  const name=document.getElementById("custName").value.trim();
  const phone=document.getElementById("custPhone").value.trim();
  const address=document.getElementById("custAddress").value.trim();
  const size=document.getElementById("custSize").value.trim();
  const color=document.getElementById("custColor").value.trim();
  if(!name||!phone||!address||!size||!color) return;
  const activeImg=selectedCard.querySelector(".slider-image.active");
  if(!activeImg) return;
  const imgUrl=new URL(activeImg.src,window.location.href).href;
  const title=selectedCard.querySelector("h3").innerText;
  const text=`اريد طلب "${title}"
الاسم: ${name}
رقم الهاتف: ${phone}
العنوان: ${address}
المقاس: ${size}
اللون / الموديل: ${color}
الصورة:
${imgUrl}`;
  window.location.href="https://wa.me/201150811175?text="+encodeURIComponent(text);
});
</script>
